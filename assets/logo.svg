<svg width="220" height="200" viewBox="0 0 220 200" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Provo Go</title>
<desc>Logo vertical de Provo Go: emblema circular turquesa con un cactus Turk's head, y el nombre debajo.</desc>

<!-- Emblema circular -->
<circle cx="110" cy="62" r="55" fill="#1FB6A8"/>

<!-- Linea de arena -->
<path d="M 60 109 Q 110 122 160 109 L 160 117 Q 110 130 60 117 Z" fill="#FDF6E3" opacity="0.85"/>

<!-- Cuerpo del cactus -->
<ellipse cx="110" cy="65" rx="30" ry="36" fill="#2E7D5B"/>
<line x1="94" y1="37" x2="94" y2="93" stroke="#1F5C42" stroke-width="2" opacity="0.55" stroke-linecap="round"/>
<line x1="102" y1="33" x2="102" y2="97" stroke="#1F5C42" stroke-width="2" opacity="0.55" stroke-linecap="round"/>
<line x1="118" y1="33" x2="118" y2="97" stroke="#1F5C42" stroke-width="2" opacity="0.55" stroke-linecap="round"/>
<line x1="126" y1="37" x2="126" y2="93" stroke="#1F5C42" stroke-width="2" opacity="0.55" stroke-linecap="round"/>

<!-- Corona coral del cactus -->
<ellipse cx="110" cy="30" rx="21" ry="14" fill="#FF6F61"/>
<line x1="100" y1="23" x2="100" y2="37" stroke="#E85347" stroke-width="1.6" opacity="0.6" stroke-linecap="round"/>
<line x1="110" y1="21" x2="110" y2="39" stroke="#E85347" stroke-width="1.6" opacity="0.6" stroke-linecap="round"/>
<line x1="120" y1="23" x2="120" y2="37" stroke="#E85347" stroke-width="1.6" opacity="0.6" stroke-linecap="round"/>

<!-- Nombre -->
<text x="110" y="160" text-anchor="middle" font-size="38" font-weight="600" font-family="Outfit, Arial, sans-serif" fill="#0B3C5D">Provo <tspan fill="#FF6F61">Go</tspan></text>

<!-- Chevrons de velocidad -->
<path d="M 88 178 L 95 185 L 88 192" stroke="#FF6F61" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>
<path d="M 103 178 L 110 185 L 103 192" stroke="#FF6F61" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/>
<path d="M 118 178 L 125 185 L 118 192" stroke="#FF6F61" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
