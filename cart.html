<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provo Go - Cart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>


<body class="home-page checking">

    <header class="topbar">
        <a href="home.html">Back</a>
        <h1>Your cart</h1>
        <a href="orders.html">Orders</a>
    </header>

    <main>
        <div id="cart-items"></div>

        <div id="cart-summary" class="hidden">

            <div class="summary">
                <div class="summary-line">
                    <span>Subtotal</span>
                    <span id="subtotal"></span>
                </div>
                <div class="summary-line">
                    <span>Delivery</span>
                    <span id="delivery-fee"></span>
                </div>
                <div class="summary-line summary-total">
                    <span>Total</span>
                    <span id="total"></span>
                </div>
            </div>

            <form id="order-form">
                <label for="address">Delivery address</label>
                <input type="text" id="address" required minlength="5" autocomplete="street-address">
                <button type="submit" id="place-order">Place order</button>
            </form>

            <p id="order-message" class="message hidden"></p>

        </div>
    </main>

    <script type="module" src="js/cart-page.js"></script>

</body>


</html>
